name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          # Real value is injected at deploy time; a placeholder here just
          # lets the Next.js production build complete (NEXT_PUBLIC_* vars
          # are inlined at build time, not read at runtime).
          NEXT_PUBLIC_API_URL: https://api.example.com
